# Prometheus Alerting Rules for Jewellery Visual Retrieval Engine (PH-009)
groups:
  - name: jewellery_search_alerts
    rules:
      - alert: SearchErrorRateHigh
        expr: sum(rate(jewellery_retrieval_requests_total{status_code=~"5.."}[2m])) / sum(rate(jewellery_retrieval_requests_total[2m])) > 0.05
        for: 2m
        labels:
          severity: critical
          service: jewellery-search
        annotations:
          summary: "Visual search 5xx error rate exceeds 5%"
          description: "High search failure rate detected across active traffic (current rate: {{ $value | humanizePercentage }})."

      - alert: CanaryCandidateErrorRateHigh
        expr: sum(rate(jewellery_search_routing_requests_total{route="canary",status="error"}[2m])) / sum(rate(jewellery_search_routing_requests_total{route="canary"}[2m])) > 0.02
        for: 2m
        labels:
          severity: critical
          service: jewellery-search
        annotations:
          summary: "Canary candidate index error rate exceeds 2%"
          description: "Candidate index errors on canary traffic exceed safety threshold. Automatic rollback recommended."

      - alert: CanaryRoutingFallbacksElevated
        expr: sum(rate(jewellery_canary_routing_fallbacks_total[1m])) * 60 > 5
        for: 1m
        labels:
          severity: warning
          service: jewellery-search
        annotations:
          summary: "Elevated canary candidate fallbacks to production"
          description: "Candidate searches are falling back to production at {{ $value }} fallbacks/min. Inspect candidate collection health."

      - alert: SearchLatencyP95Regression
        expr: histogram_quantile(0.95, sum(rate(jewellery_retrieval_latency_seconds_bucket{stage="overall"}[5m])) by (le)) > 0.100
        for: 5m
        labels:
          severity: warning
          service: jewellery-search
        annotations:
          summary: "Overall search p95 latency exceeds 100ms SLA"
          description: "End-to-end search p95 latency is {{ $value | humanizeDuration }}, exceeding the 100ms production SLA."

      - alert: IndexPromotionFailed
        expr: increase(jewellery_index_lifecycle_operations_total{operation="promote",status="failure"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
          service: jewellery-search
        annotations:
          summary: "Qdrant index promotion operation failed"
          description: "An atomic alias promotion attempt failed. Active production alias was not altered."

      - alert: ReadinessProbeFailing
        expr: sum(up{job="jewellery-app"}) == 0
        for: 1m
        labels:
          severity: critical
          service: jewellery-search
        annotations:
          summary: "Jewellery search service readiness probe failing"
          description: "Application is not responding healthy to /health/ready probe."

      - alert: StagingIncidentSimulationActive
        expr: jewellery_incident_simulation_active > 0
        for: 10s
        labels:
          severity: warning
          service: jewellery-search
        annotations:
          summary: "Staging incident simulation drill active"
          description: "Operational incident simulation drill triggered by staging test harness."

      - alert: TLSCertificateExpiringSoon
        expr: jewellery_tls_cert_expiry_days < 14
        for: 1h
        labels:
          severity: warning
          service: jewellery-search
        annotations:
          summary: "Edge TLS certificate expiring within 14 days"
          description: "Edge TLS certificate expires in {{ $value }} days. Rotate certificates immediately."

      - alert: DatabaseBackupFailed
        expr: increase(jewellery_backup_failures_total[1h]) > 0
        for: 1m
        labels:
          severity: critical
          service: jewellery-search
        annotations:
          summary: "Scheduled database or vector index backup failed"
          description: "One or more automated backup jobs failed in the last hour. Inspect backup manager logs."
