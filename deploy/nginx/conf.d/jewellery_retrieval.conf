# Production NGINX Reverse-Proxy & Edge Security Configuration for Jewellery Visual Retrieval Engine

upstream jewellery_backend {
    server app:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Proxy cache zone for static, non-authenticated media thumbnails
proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media_cache:10m max_size=1g inactive=24h use_temp_path=off;

# ------------------------------------------------------------------------------
# 1. HTTP Server — Enforce HTTPS Redirection & ACME Challenge
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name search.jewellery.internal;

    # Let's Encrypt / Certbot renewal challenge path
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other HTTP traffic to HTTPS (301 Permanent)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server — TLS 1.3, Edge Security & Reverse Proxy
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name search.jewellery.internal;

    # TLS Certificates (Mounted from volume / secrets vault)
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS Protocols & Cipher Suites (Strict TLS 1.3 / Modern TLS 1.2)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # TLS Session Parameters
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # Mandatory Security Headers
    # --------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --------------------------------------------------------------------------
    # Request & Upload Size Limits
    # --------------------------------------------------------------------------
    client_max_body_size 10M;
    client_body_buffer_size 256k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # --------------------------------------------------------------------------
    # Upstream Timeouts & Connection Limits
    # --------------------------------------------------------------------------
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 65s;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
    proxy_http_version 1.1;

    # Forwarded Headers (Preserve caller identity & protocol)
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;

    # --------------------------------------------------------------------------
    # Sensitive Endpoint Access Control (Internal Network Only)
    # --------------------------------------------------------------------------

    # Prometheus Scraping Endpoint: Restrict to internal monitoring subnet
    location /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://jewellery_backend/metrics;
    }

    # Index Lifecycle Administration: Restrict to internal management subnets
    location /api/lifecycle/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://jewellery_backend;
    }

    # --------------------------------------------------------------------------
    # Static Media Asset Caching (/media/)
    # --------------------------------------------------------------------------
    location /media/ {
        proxy_pass http://jewellery_backend;

        # Bypass cache whenever caller presents tenant auth tokens
        proxy_cache_bypass $http_authorization $http_x_api_key;
        proxy_no_cache $http_authorization $http_x_api_key;

        proxy_cache media_cache;
        proxy_cache_valid 200 24h;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;

        expires 24h;
        add_header Cache-Control "public, no-transform" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # --------------------------------------------------------------------------
    # API & Health Routing (Default)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://jewellery_backend;
        
        # Disable caching for all dynamic API endpoints
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Custom JSON error responses preventing upstream stack trace leakage
    proxy_intercept_errors on;
    error_page 500 502 503 504 /50x.json;
    location = /50x.json {
        return 503 '{"status":"error","detail":"Service temporarily unavailable. Please retry shortly."}';
        add_header Content-Type application/json always;
    }
}
