# ==============================================================================
# Staging Docker Compose for Jewellery Visual Retrieval Engine (PH-011)
# Architecture: Isolated PostgreSQL 16 + Redis 7 + Qdrant + NGINX + Prometheus
#
# Isolation Guarantees:
# - Completely separate volume names (jewellery_staging_*) preventing production data collision.
# - Dedicated non-standard loopback ports (Postgres: 5433, Redis: 6380, Qdrant: 6335, NGINX: 8443/8080, Prom: 9091).
# - Ports bound strictly to 127.0.0.1 (never published to 0.0.0.0).
# - Separate staging credentials and database name (jewellery_staging).
# ==============================================================================

version: '3.8'

networks:
  jewellery_staging_net:
    driver: bridge

volumes:
  jewellery_staging_postgres_data:
    name: jewellery_staging_postgres_data
  jewellery_staging_redis_data:
    name: jewellery_staging_redis_data
  jewellery_staging_qdrant_data:
    name: jewellery_staging_qdrant_data
  jewellery_staging_prom_data:
    name: jewellery_staging_prom_data

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16: Isolated Staging Relational Database
  # ----------------------------------------------------------------------------
  staging_postgres:
    image: postgres:16-alpine
    container_name: jewellery_staging_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jewellery_staging
      POSTGRES_USER: staging_user
      POSTGRES_PASSWORD: staging_secret_pass_2026
    volumes:
      - jewellery_staging_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staging_user -d jewellery_staging"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - jewellery_staging_net

  # ----------------------------------------------------------------------------
  # Redis 7: Isolated Staging Rate Limiter & Token Bucket Cache
  # ----------------------------------------------------------------------------
  staging_redis:
    image: redis:7-alpine
    container_name: jewellery_staging_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "notice"]
    volumes:
      - jewellery_staging_redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - jewellery_staging_net

  # ----------------------------------------------------------------------------
  # Qdrant: Isolated Staging Vector Database
  # ----------------------------------------------------------------------------
  staging_qdrant:
    image: qdrant/qdrant:latest
    container_name: jewellery_staging_qdrant
    restart: unless-stopped
    volumes:
      - jewellery_staging_qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6335:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - jewellery_staging_net

  # ----------------------------------------------------------------------------
  # NGINX: Edge Reverse Proxy with TLS 1.3 & Security Hardening
  # ----------------------------------------------------------------------------
  staging_nginx:
    image: nginx:1.25-alpine
    container_name: jewellery_staging_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/conf.d/jewellery_staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/conf.d/proxy_secret.inc:/etc/nginx/conf.d/proxy_secret.inc:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    networks:
      - jewellery_staging_net

  # ----------------------------------------------------------------------------
  # Prometheus: Staging Observability Scraper & Alert Rule Evaluator
  # ----------------------------------------------------------------------------
  staging_prometheus:
    image: prom/prometheus:v2.50.1
    container_name: jewellery_staging_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../dashboards/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - jewellery_staging_prom_data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    networks:
      - jewellery_staging_net

  # ----------------------------------------------------------------------------
  # Alertmanager: Staging Incident Alert Notification Dispatcher (PH-012)
  # ----------------------------------------------------------------------------
  staging_alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: jewellery_staging_alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - jewellery_staging_net

