global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["staging_alertmanager:9093"]

scrape_configs:
  - job_name: "jewellery-staging-app"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["staging_nginx:80"]
        labels:
          environment: "staging"
          service: "jewellery-search"
