# Staging NGINX Reverse-Proxy & Edge Security Configuration for Jewellery Visual Retrieval Engine
# Milestone PH-011

upstream jewellery_backend {
    server host.docker.internal:8001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Proxy cache zone for static media thumbnails in staging
proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=staging_media_cache:10m max_size=500m inactive=12h use_temp_path=off;

# ------------------------------------------------------------------------------
# 1. HTTP Server — Enforce HTTPS Redirection
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name staging.jewellery-search.local localhost;

    # ACME Challenge placeholder
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Allow internal metrics scraping from Docker network without TLS
    location /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        include /etc/nginx/conf.d/proxy_secret.inc;
        proxy_pass http://jewellery_backend/metrics;
    }

    # Redirect all HTTP traffic to HTTPS port 8443 in staging
    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server — TLS 1.3, Edge Security & Reverse Proxy
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.jewellery-search.local localhost;

    # Disposable Self-Signed Staging TLS Certificates
    ssl_certificate /etc/nginx/certs/staging_fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/staging_privkey.pem;

    # TLS Protocols & Cipher Suites (Strict TLS 1.3 / Modern TLS 1.2)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # TLS Session Parameters
    ssl_session_cache shared:STAGING_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Note: OCSP stapling is disabled in staging for self-signed certificates
    ssl_stapling off;
    ssl_stapling_verify off;

    # --------------------------------------------------------------------------
    # Mandatory Security Headers
    # --------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --------------------------------------------------------------------------
    # Request & Upload Size Limits
    # --------------------------------------------------------------------------
    client_max_body_size 10M;
    client_body_buffer_size 256k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # --------------------------------------------------------------------------
    # Upstream Timeouts & Connection Limits
    # --------------------------------------------------------------------------
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 65s;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
    proxy_http_version 1.1;

    # Forwarded Headers
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 8443;
    # Dynamically injected proxy secret (mounted from uncommitted proxy_secret.inc)
    include /etc/nginx/conf.d/proxy_secret.inc;

    # --------------------------------------------------------------------------
    # Sensitive Endpoint Access Control (Internal Network Only)
    # --------------------------------------------------------------------------
    location /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://jewellery_backend/metrics;
    }

    location /api/lifecycle/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://jewellery_backend;
    }

    # --------------------------------------------------------------------------
    # Static Media Asset Caching (/media/)
    # --------------------------------------------------------------------------
    location /media/ {
        proxy_pass http://jewellery_backend;

        proxy_cache_bypass $http_authorization $http_x_api_key;
        proxy_no_cache $http_authorization $http_x_api_key;

        proxy_cache staging_media_cache;
        proxy_cache_valid 200 12h;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;

        expires 12h;
        add_header Cache-Control "public, no-transform" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # --------------------------------------------------------------------------
    # Default API & Health Routing
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://jewellery_backend;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Custom JSON error responses preventing upstream stack trace leakage
    proxy_intercept_errors on;
    error_page 500 502 503 504 /50x.json;
    location = /50x.json {
        return 503 '{"status":"error","detail":"Staging service temporarily unavailable. Please retry shortly."}';
        add_header Content-Type application/json always;
    }
}
